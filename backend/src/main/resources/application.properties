# ==============================================================================
# Sridevi Sarees & Collections - Spring Boot Configuration
# ==============================================================================

# Application
spring.application.name=sridevi-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=sridevi_collections_db

# JWT Configuration
app.jwt.expiration-ms=1800000

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Spring Boot Actuator: exposure restricted to health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.health.mongo.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sridevisarees.backend=INFO
logging.level.org.springframework.data.mongodb=INFO
