# ==============================================================================
# Sridevi Sarees & Collections - Spring Boot Configuration
# ==============================================================================

spring.application.name=sridevi-backend
server.port=${PORT:8080}

# Target MongoDB Database Name
spring.data.mongodb.database=sridevi_collections_db

# MongoDB URI directly configured with sridevi_collections_db
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://Sridevi_Sarees:Sridevi_sarees_collections@cluster0.gjzc24y.mongodb.net/sridevi_collections_db?retryWrites=true&w=majority&appName=Cluster0}

# CORS Allowed Origins (Matches React development dev server on port 5173)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mongo.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.sridevisarees.backend=DEBUG
logging.level.org.springframework.data.mongodb=INFO
